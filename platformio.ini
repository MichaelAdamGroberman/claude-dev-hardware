[env:m5stickc-plus]
platform = espressif32@6.5.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
; Exclude the precompiled Bluedroid BLE wrapper — we use NimBLE instead,
; which frees ~30-40 KB of heap so WiFi + WG also fit on this PICO-D4.
lib_ignore = BLE
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    ; NimBLE — lightweight BLE host, drop-in for the same NUS service.
    ; ~30-40 KB lighter than Bluedroid; that headroom is what lets the
    ; WiFi driver init alongside BLE on this single-radio chip.
    h2zero/NimBLE-Arduino @ ^2.2.0
    ; WireGuard tunnel — connects the M5 to a tailnet-routing peer so
    ; remote buddy_bridged daemons (or any TCP client on the tailnet)
    ; can reach the device when it's out of BLE range.
    ciniml/WireGuard-ESP32 @ ^0.1.5
